name: Cut Release

# One-click release (trigger via GitHub Actions UI).
# - Bumps the version in pubspec.yaml (increments the build number)
# - Commits the change
# - Creates an annotated vX.Y.Z tag
# - Pushes the commit + tag
#
# This is the only thing you need to do for a new version.
#
# Because fdroiddata is configured with AutoUpdateMode + UpdateCheckMode: Tags,
# F-Droid will automatically discover the new tag, pick up the version,
# and build the new release from source on their servers (no MR needed).
#
# After the tag is pushed, the release workflow is dispatched on that tag.
# It uploads the APK and Play AAB and attaches both files to the GitHub release.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "New semantic version to release (e.g. 4.2.0). Build number is auto-incremented from pubspec."
        required: true
        type: string

permissions:
  contents: write

jobs:
  bump-version-and-tag:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
      pull-requests: write
    steps:
      - name: Checkout with token for pushing
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup environment (gives us yq)
        uses: jdx/mise-action@6d1e696aa24c1aa1bcc1adea0212707c71ab78a8 # v3

      - name: Setup git config
        run: |
          git config user.name actions-bot
          git config user.email actions-bot@users.noreply.github.com

      # Refresh dependencies before tagging. If that changes files, open a PR
      # and do not tag, so the release is not cut with a stale pubspec.lock.
      - name: Install
        run: mise run install

      - name: Create Pull Request if there is new stuff from updaters
        id: pr_create
        uses: peter-evans/create-pull-request@c0f553fe549906ede9cf27b5156039d195d2ece0 # v8.1.0
        with:
          commit-message: Updater script changes
          branch: updater-bot
          delete-branch: true
          title: "Bot: automated changes"
          body: |
            Changes caused from update scripts

      - name: Stop if a pull request was created
        env:
          PR_NUMBER: ${{ steps.pr_create.outputs.pull-request-number }}
        run: |
          if [[ -n "$PR_NUMBER" ]]; then
            echo "The update scripts changed something and a PR was created. Giving up deploy." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Check lockfile
        run: flutter pub get --enforce-lockfile

      - name: Bump version in pubspec.yaml
        run: |
          set -euo pipefail

          NEW_SEMVER="${{ github.event.inputs.version }}"
          CURRENT=$(yq '.version' pubspec.yaml)
          CURRENT_BUILD=$(echo "$CURRENT" | sed -n 's/.*+\([0-9]*\)$/\1/p')
          CURRENT_BUILD=${CURRENT_BUILD:-0}
          NEW_BUILD=$((CURRENT_BUILD + 1))
          NEW_VERSION="${NEW_SEMVER}+${NEW_BUILD}"

          yq -i ".version = \"${NEW_VERSION}\"" pubspec.yaml

          echo "Bumped pubspec version to: ${NEW_VERSION}"

      - name: Commit, tag and push
        run: |
          set -euo pipefail

          NEW_SEMVER="${{ github.event.inputs.version }}"
          TAG="v${NEW_SEMVER}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add pubspec.yaml
          git commit -m "chore(release): ${NEW_SEMVER}"

          git tag -a "${TAG}" -m "Limpazap ${NEW_SEMVER}"

          git push origin HEAD
          git push origin "${TAG}"

          echo "Created and pushed tag ${TAG}"

      - name: Dispatch release workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="v${{ github.event.inputs.version }}"
          gh workflow run release.yml --ref "$TAG"
